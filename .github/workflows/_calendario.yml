name: Actualizar calendario (reusable)

on:
  workflow_call:
    inputs:
      id:
        description: "ID del calendario, p. ej. deportes/baloncesto/estudiantes"
        required: true
        type: string
      ics:
        description: "Ruta pública del .ics, p. ej. deportes/baloncesto/estudiantes.ics"
        required: true
        type: string

permissions:
  contents: write

jobs:
  actualizar:
    name: ${{ inputs.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historial completo para pull --rebase antes del push

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12" # misma stdlib/zoneinfo en CI y local

      - name: Tests del motor y los proveedores
        env:
          CALENDARIOS_TEST: "1"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/comun/tests -t . -v
          for directorio in scripts/proveedores/*/tests; do
            [ -d "$directorio" ] || continue
            python3 -m unittest discover -s "$directorio" -t . -v
          done

      - name: Tests del calendario
        env:
          ID: ${{ inputs.id }}
          CALENDARIOS_TEST: "1"
        run: |
          set -euo pipefail
          # El código vive en scripts/calendarios/<id>/; el ICS y el estado, aparte.
          directorio="scripts/calendarios/$ID/tests"
          if [ -d "$directorio" ]; then
            python3 -m unittest discover -s "$directorio" -t . -v
          fi

      - name: Generar calendario
        env:
          ID: ${{ inputs.id }}
        run: python3 -m scripts actualizar --solo "$ID"

      - name: Validar ICS y JSON
        env:
          ID: ${{ inputs.id }}
          ICS: ${{ inputs.ics }}
          ESTADO: estado/${{ inputs.id }}
        run: |
          set -euo pipefail
          python3 -m scripts validar "$ICS"
          if [ -d "$ESTADO" ]; then
            find "$ESTADO" -name '*.json' -print0 \
              | xargs -0 -r -n1 python3 -m json.tool >/dev/null
          fi
          git diff --check -- . ":(exclude)$ICS"

      - name: Commit y push si hay cambios reales
        env:
          ID: ${{ inputs.id }}
          ICS: ${{ inputs.ics }}
          ESTADO: estado/${{ inputs.id }}
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          # Solo se publica el ICS de este calendario y su estado interno.
          git add -- "$ICS"
          if [ -d "$ESTADO" ]; then
            git add -- "$ESTADO"
          fi

          if git diff --cached --quiet -- "$ICS" "$ESTADO"; then
            echo "Sin cambios."
            exit 0
          fi

          # DTSTAMP cambia en cada ejecución: si es lo único que cambia, no se publica.
          if ! git diff --cached -U0 -- "$ICS" "$ESTADO" \
              | grep -E '^[+-][^-+]' \
              | grep -v '^[+-]DTSTAMP:' \
              | grep -q .; then
            echo "Sin cambios reales (solo DTSTAMP)."
            exit 0
          fi

          git commit -m "auto($ID): actualiza calendario $(date -u +%FT%H%MZ)"

          # Varios calendarios pueden terminar a la vez: reintentar el rebase+push.
          for intento in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "Push falló (intento $intento/3); reintentando..."
            sleep $((intento * 5))
          done
          echo "No se pudo publicar el calendario tras 3 intentos." >&2
          exit 1
