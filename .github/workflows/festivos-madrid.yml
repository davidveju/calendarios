name: Calendario · Festivos · Madrid

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendario-festivos-madrid
  cancel-in-progress: false

jobs:
  actualizar:
    uses: ./.github/workflows/_calendario.yml
    with:
      id: festivos/madrid
      ics: festivos/madrid.ics
