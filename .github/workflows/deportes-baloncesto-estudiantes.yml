name: Calendario · Deportes · Baloncesto · Estudiantes

on:
  schedule:
    # lunes, miércoles y viernes 12:00 UTC (resultados del finde + cambios de semana)
    - cron: "0 12 * * 1,3,5"
  workflow_dispatch: # ejecución manual desde la pestaña Actions

permissions:
  contents: write

# Cada calendario tiene su propio grupo: un fallo o una ejecución larga
# de otro calendario no bloquea este.
concurrency:
  group: calendario-deportes-baloncesto
  cancel-in-progress: false

jobs:
  actualizar:
    uses: ./.github/workflows/_calendario.yml
    with:
      id: deportes/baloncesto/estudiantes
      ics: deportes/baloncesto/estudiantes.ics
