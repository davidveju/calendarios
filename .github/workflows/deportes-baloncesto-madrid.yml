name: Calendario · Deportes · Baloncesto · Madrid

on:
  schedule:
    - cron: "0 12 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendario-deportes-baloncesto-madrid
  cancel-in-progress: false

jobs:
  actualizar:
    uses: ./.github/workflows/_calendario.yml
    with:
      id: deportes/baloncesto/madrid
      ics: deportes/baloncesto/madrid.ics
