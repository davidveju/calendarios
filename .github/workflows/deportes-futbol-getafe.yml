name: Calendario · Deportes · Fútbol · Getafe

on:
  schedule:
    - cron: "0 12 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: calendario-deportes-futbol
  cancel-in-progress: false

jobs:
  actualizar:
    uses: ./.github/workflows/_calendario.yml
    with:
      id: deportes/futbol/getafe
      ics: deportes/futbol/getafe.ics
